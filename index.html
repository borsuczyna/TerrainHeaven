<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SanTown</title>
  </head>
  <body>
    <canvas id="editor"></canvas>
    <div id="toolbar">
      <button id="btn-select" title="Select" class="active"><i data-lucide="mouse-pointer-2"></i></button>
      <button id="btn-road" title="Add Road"><i data-lucide="route"></i></button>
      <button id="btn-intersection" title="Add Intersection"><i data-lucide="git-fork"></i></button>
      <button id="btn-wireframe" title="Wireframe"><i data-lucide="grid-3x3"></i></button>
      <button id="btn-uv" title="UV Tool"><i data-lucide="scan"></i></button>
      <button id="btn-textures" title="Textures"><i data-lucide="image"></i></button>
      <button id="btn-settings" title="Settings"><i data-lucide="settings"></i></button>
      <button id="btn-save" title="Save Project"><i data-lucide="save"></i></button>
      <button id="btn-load" title="Load Project"><i data-lucide="folder-open"></i></button>
    </div>
    <div id="properties-panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

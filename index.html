<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SanTown</title>
  </head>
  <body>
    <canvas id="editor" tabindex="0"></canvas>
    <header id="header-toolbar">
      <div class="header-actions">
        <button id="header-save" class="header-btn" type="button">Save</button>
        <button id="header-load" class="header-btn" type="button">Load</button>
        <button id="header-settings" class="header-btn" type="button">Settings</button>
      </div>
    </header>
    <div id="toolbar">
      <button id="btn-select" data-tooltip="Select" class="active"><i data-lucide="mouse-pointer-2"></i></button>
      <button id="btn-road" data-tooltip="Road / Intersection" data-switcher="road" ><i data-lucide="route"></i></button>
      <button id="btn-terrain" data-tooltip="Terrain Tool"><i data-lucide="mountain"></i></button>
      <button id="btn-uv" data-tooltip="UV Mapper"><i data-lucide="scan"></i></button>
      <button id="btn-textures" data-tooltip="Texture Browser"><i data-lucide="image"></i></button>
      <button id="btn-wireframe" data-tooltip="Wireframe"><i data-lucide="grid-3x3"></i></button>
    </div>
    <div id="properties-panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
